<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1250px;
    height: 157px;
    background: #FDFDFD;
    overflow: hidden;
  }
  svg {
    display: block;
    width: 1250px;
    height: 157px;

</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 157" width="1250" height="157">

    <!-- Soft dropshadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">

      <stop offset="100%" stop-color="#FDFDFD" stop-opacity="1" />
